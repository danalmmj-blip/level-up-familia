<style>
:root{--bg:#0c1022;--panel:#171d35;--panel2:#202847;--text:#f4f5ff;--muted:#a7b0d0;--purple:#8065ff;--blue:#45c8ff;--pink:#ff64c8;--green:#52e0a1;--gold:#ffcf5a;--line:#303958}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(ellipse at top,#282354 0%,#10152c 38%,#090d1b 100%);color:var(--text);min-height:100vh;padding-bottom:82px}button{border:0;color:inherit;font:inherit;cursor:pointer}header{padding:18px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:rgba(11,15,29,.92);backdrop-filter:blur(12px);z-index:3;border-bottom:1px solid #242c49}.brand small{letter-spacing:2px;color:#a8b0d6;font-weight:800}.brand h1{margin:2px 0;font-size:25px;letter-spacing:.5px}.profile-switch{display:flex;gap:7px}.profile-switch button{padding:10px 12px;border-radius:22px;background:#232a48;border:1px solid #394263;font-weight:700}.profile-switch button.active{background:linear-gradient(120deg,#7053f5,#9a70ff);border-color:transparent}.wrap{max-width:760px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#342d77,#242b55 60%,#173c5d);border:1px solid #424a82;border-radius:22px;padding:18px;margin:8px 0 15px;box-shadow:0 12px 30px #05081555}.heroTop{display:flex;justify-content:space-between;align-items:flex-start}.hero h2{margin:0 0 5px;font-size:21px}.hero p{margin:0;color:#c4cae8}.levelRow{display:flex;align-items:center;gap:10px;margin:17px 0 9px}.levelBadge{width:52px;height:52px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#ffcf5a,#ff9d43);font-size:24px;color:#2a2140;font-weight:900}.levelText{flex:1}.levelText strong{display:block}.progress{height:9px;border-radius:99px;background:#171c36;overflow:hidden;margin-top:8px}.progress span{height:100%;display:block;background:linear-gradient(90deg,#55cfff,#aa71ff);width:0;border-radius:99px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#10162e77;border:1px solid #424b7a;border-radius:13px;text-align:center;padding:10px}.stat b{display:block;font-size:21px}.stat small{color:#b9c2e4}.section{margin:16px 0}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sectionHead h3{margin:0;font-size:18px}.card{background:linear-gradient(145deg,#1a213d,#141a31);border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:10px}.task{display:flex;align-items:center;gap:12px}.taskEmoji{font-size:25px;width:43px;height:43px;border-radius:12px;background:#2b3355;display:grid;place-items:center}.taskInfo{flex:1;min-width:0}.taskInfo strong{display:block}.taskInfo small{color:var(--muted)}.points{font-weight:900;color:var(--gold);white-space:nowrap}.action{border-radius:12px;padding:10px 13px;background:linear-gradient(120deg,#7254f5,#8c68ff);font-weight:800}.action.secondary{background:#2b3456;border:1px solid #454f77}.action.green{background:linear-gradient(120deg,#26a979,#49d6a0);color:#08281b}.action.red{background:#71354b}.action:disabled{opacity:.45;cursor:not-allowed}.reward{display:flex;gap:12px;align-items:center}.reward .taskEmoji{font-size:28px}.bottomNav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#10152bfa;border-top:1px solid #303857;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}.bottomNav button{background:transparent;color:#aab2d3;text-align:center;font-size:12px;padding:5px}.bottomNav button.active{color:#b99aff}.bottomNav .navEmoji{display:block;font-size:22px;margin-bottom:2px}.view{display:none}.view.active{display:block}.empty{text-align:center;color:var(--muted);padding:20px}.parentPanel{background:#1c2440;border:1px solid #394465;border-radius:17px;padding:15px;margin-bottom:12px}.parentPanel h3{margin-top:0}.field{width:100%;background:#0e1429;border:1px solid #3b4567;border-radius:10px;padding:12px;color:white;margin:6px 0 10px;font:inherit}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.approval{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.approval .taskInfo{flex-basis:45%}.notice{background:#29264c;color:#d8d5ff;border-radius:12px;padding:11px;font-size:13px}.medal{font-size:20px}.tiny{font-size:12px;color:var(--muted)}.leader{display:flex;align-items:center;gap:12px}.leaderNum{font-weight:900;color:var(--gold);font-size:20px}.leaderName{flex:1}.modalBackdrop{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modalBackdrop.show{display:flex}.modal{background:#1b2240;border:1px solid #465075;border-radius:20px;padding:18px;width:min(420px,100%)}.modal h3{margin-top:0}.modalActions{display:flex;gap:8px;margin-top:10px}.modalActions button{flex:1}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#273252;border:1px solid #58678d;padding:11px 16px;border-radius:13px;display:none;z-index:12;box-shadow:0 10px 30px #0007}.toast.show{display:block}@media(min-width:650px){.wrap{padding:20px}.stats{gap:14px}}
</style></head><body>
<div id="authGate" style="position:fixed;inset:0;background:#090d1b;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px"><div style="max-width:420px;width:100%;background:#1a213d;border:1px solid #394263;border-radius:20px;padding:22px"><h2>🎮 Level Up Familia</h2><p id="authMessage" style="color:#a7b0d0">Inicia sesión para sincronizar la familia.</p><input id="authEmail" class="field" type="email" placeholder="Correo familiar"><input id="authPassword" class="field" type="password" placeholder="Contraseña (mín. 6 caracteres)"><button class="action" style="width:100%;margin-bottom:8px" onclick="familySignIn()">Entrar</button><button class="action secondary" style="width:100%" onclick="familySignUp()">Crear cuenta familiar</button><p class="tiny">Todos los dispositivos de la familia deberán usar la misma cuenta.</p></div></div><header><div class="brand"><small>FAMILY GAMING</small><h1>LEVEL UP 🎮</h1></div><div class="profile-switch" id="profileSwitch"></div></header>
<main class="wrap">
<div class="view active" id="view-home"></div><div class="view" id="view-tasks"></div><div class="view" id="view-rewards"></div><div class="view" id="view-parents"></div>
</main>
<nav class="bottomNav"><button data-view="home" class="active"><span class="navEmoji">🏡</span>Inicio</button><button data-view="tasks"><span class="navEmoji">⚡</span>Tareas</button><button data-view="rewards"><span class="navEmoji">🎁</span>Premios</button><button data-view="parents"><span class="navEmoji">🛡️</span>Padres</button></nav>
<div class="modalBackdrop" id="modal"><div class="modal" id="modalContent"></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://geuhourlgzysalpkfyfv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_W25z6-ADK4KYhVpkFupTSg_foh6uEfz";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const FAMILY_STATE_ID = "level-up-familia";
const initial={profiles:[{id:'dani',name:'Dani',avatar:'👧',role:'child',points:0,xp:0,level:1},{id:'alan',name:'Alan',avatar:'👦',role:'child',points:0,xp:0,level:1}],tasks:[{id:'bed',title:'Hacer la cama',description:'Dejar la cama arreglada',emoji:'🛏️',points:10,frequency:'daily'},{id:'teeth',title:'Lavarse los dientes',description:'Por la mañana y por la noche',emoji:'🪥',points:5,frequency:'daily'},{id:'room',title:'Ordenar habitación',description:'Todo recogido y en su sitio',emoji:'🧹',points:15,frequency:'daily'},{id:'homework',title:'Hacer deberes',description:'Terminar los deberes del día',emoji:'📚',points:20,frequency:'daily'},{id:'read',title:'Leer 20 minutos',description:'Un ratito de lectura',emoji:'📖',points:15,frequency:'daily'},{id:'help',title:'Ayudar en casa',description:'Ayudar sin que lo pidan',emoji:'🤝',points:20,frequency:'daily'},{id:'backpack',title:'Preparar mochila',description:'Lista para mañana',emoji:'🎒',points:10,frequency:'daily'},{id:'weekly',title:'Tarea semanal',description:'Una tarea especial de la semana',emoji:'🏆',points:50,frequency:'weekly'}],rewards:[{id:'movie',title:'Noche de película',description:'Elegir la peli familiar',emoji:'🍿',cost:100},{id:'console',title:'30 min extra de consola',description:'Tiempo extra de juego',emoji:'🎮',cost:150},{id:'dinner',title:'Elegir la cena',description:'Elegir la cena de la familia',emoji:'🍕',cost:250},{id:'surprise',title:'Sorpresa especial',description:'Premio sorpresa',emoji:'🎁',cost:500}],completions:[],redemptions:[],history:[]};
let data;try{data=JSON.parse(localStorage.getItem('levelup-familia-v1'))||structuredClone(initial)}catch(e){data=structuredClone(initial)}let current='dani';let activeView='home';let parentUnlocked=false;
let saveTimer=null;
let cloudChannel=null,cloudLoadBusy=false,cloudSavePending=false,lastCloudUpdatedAt=null;
function save(){localStorage.setItem('levelup-familia-v1',JSON.stringify(data));render();clearTimeout(saveTimer);saveTimer=setTimeout(syncStateToCloud,700)}
async function syncStateToCloud(){if(cloudSavePending)return;cloudSavePending=true;try{const {data:sessionData}=await supabaseClient.auth.getSession();const user=sessionData.session?.user;if(!user)return;const snapshot=JSON.parse(JSON.stringify(data));const {data:existing,error:readError}=await supabaseClient.from('family_state').select('updated_at').eq('id',FAMILY_STATE_ID).maybeSingle();if(readError){toast('Error comprobando sincronización: '+readError.message);return}const payload={id:FAMILY_STATE_ID,owner_id:user.id,state:snapshot,updated_at:new Date().toISOString()};const {error}=await supabaseClient.from('family_state').upsert(payload,{onConflict:'id'});if(error)toast('Error sincronizando: '+error.message);else lastCloudUpdatedAt=payload.updated_at}finally{cloudSavePending=false}}
async function loadStateFromCloud(){if(cloudLoadBusy)return;cloudLoadBusy=true;try{const {data:sessionData}=await supabaseClient.auth.getSession();const user=sessionData.session?.user;if(!user)return;const {data:row,error}=await supabaseClient.from('family_state').select('state,updated_at').eq('id',FAMILY_STATE_ID).maybeSingle();if(error){toast('Error cargando datos: '+error.message);return}if(row?.state){data=row.state;lastCloudUpdatedAt=row.updated_at||null;localStorage.setItem('levelup-familia-v1',JSON.stringify(data))}else{await syncStateToCloud()}render()}finally{cloudLoadBusy=false}}
async function familySignIn(){const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;if(!email||!password){document.getElementById('authMessage').textContent='Introduce correo y contraseña.';return}const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)document.getElementById('authMessage').textContent=error.message}
async function familySignUp(){const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;if(!email||password.length<6){document.getElementById('authMessage').textContent='Pon un correo y una contraseña de al menos 6 caracteres.';return}const {error}=await supabaseClient.auth.signUp({email,password});document.getElementById('authMessage').textContent=error?error.message:'Cuenta creada. Si Supabase pide confirmar el correo, revisa tu bandeja y confirma antes de iniciar sesión.'}
function initCloudApp(){if(SUPABASE_PUBLISHABLE_KEY.includes('PEGA_AQUI')){document.getElementById('authMessage').textContent='Falta configurar la clave publishable de Supabase en el archivo index.html.';return}supabaseClient.auth.getSession().then(({data})=>{if(data.session){document.getElementById('authGate').style.display='none';loadStateFromCloud().then(subscribeCloud)}else render()})}
function subscribeCloud(){if(cloudChannel){supabaseClient.removeChannel(cloudChannel);cloudChannel=null}cloudChannel=supabaseClient.channel('family-state-sync').on('postgres_changes',{event:'*',schema:'public',table:'family_state',filter:'id=eq.'+FAMILY_STATE_ID},payload=>{if(!payload.new?.state||cloudSavePending||cloudLoadBusy||saveTimer)return;const incomingTime=payload.new.updated_at||null;if(lastCloudUpdatedAt&&incomingTime&&incomingTime<=lastCloudUpdatedAt)return;data=payload.new.state;lastCloudUpdatedAt=incomingTime;localStorage.setItem('levelup-familia-v1',JSON.stringify(data));render()}).subscribe((status)=>{if(status==='CHANNEL_ERROR')toast('Sincronización en tiempo real desconectada')})}
supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='INITIAL_SESSION')return;if(session){document.getElementById('authGate').style.display='none';setTimeout(()=>{loadStateFromCloud().then(subscribeCloud)},0)}else{document.getElementById('authGate').style.display='flex';if(cloudChannel){supabaseClient.removeChannel(cloudChannel);cloudChannel=null}}});
function profile(){return data.profiles.find(p=>p.id===current)}function today(){return new Date().toISOString().slice(0,10)}function week(){let d=new Date();let monday=new Date(d);monday.setDate(d.getDate()-((d.getDay()+6)%7));return monday.toISOString().slice(0,10)}function isDone(task){return data.completions.some(c=>c.profileId===current&&c.taskId===task.id&&c.date===today()&&c.status!=='rejected')}
function xpNeeded(l){return l*100}function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function switchProfile(id){current=id;render()}
function submitTask(taskId){let t=data.tasks.find(t=>t.id===taskId);if(!t)return;let existing=data.completions.find(c=>c.profileId===current&&c.taskId===taskId&&c.date===today()&&c.status!=='rejected');if(existing){toast('Esta tarea ya está enviada hoy');return}data.completions.push({id:crypto.randomUUID(),profileId:current,taskId,date:today(),status:'pending',submittedAt:new Date().toISOString()});save();toast('¡Tarea enviada para aprobación!')}
function approve(id,ok){let c=data.completions.find(x=>x.id===id);if(!c)return;c.status=ok?'approved':'rejected';c.approvedAt=new Date().toISOString();if(ok){let t=data.tasks.find(t=>t.id===c.taskId),p=data.profiles.find(p=>p.id===c.profileId);p.points+=t.points;p.xp+=t.points;while(p.xp>=xpNeeded(p.level)){p.xp-=xpNeeded(p.level);p.level++}data.history.push({profileId:p.id,amount:t.points,reason:'Tarea aprobada: '+t.title,date:today()})}save();toast(ok?'¡Puntos añadidos!':'Tarea rechazada')}
function redeem(id){let r=data.rewards.find(r=>r.id===id),p=profile();if(!r||p.points<r.cost){toast('No tienes puntos suficientes');return}data.redemptions.push({id:crypto.randomUUID(),profileId:current,rewardId:id,status:'pending',date:today()});save();toast('Solicitud de premio enviada')}
function approveReward(id,ok){let red=data.redemptions.find(x=>x.id===id);if(!red)return;red.status=ok?'approved':'rejected';red.approvedAt=new Date().toISOString();if(ok){let p=data.profiles.find(p=>p.id===red.profileId),r=data.rewards.find(r=>r.id===red.rewardId);p.points=Math.max(0,p.points-r.cost);data.history.push({profileId:p.id,amount:-r.cost,reason:'Premio: '+r.title,date:today()})}save();toast(ok?'Premio aprobado':'Solicitud rechazada')}
function renderSwitch(){document.getElementById('profileSwitch').innerHTML=data.profiles.map(p=>`<button class="${p.id===current?'active':''}" onclick="switchProfile('${p.id}')">${p.avatar} ${p.name}</button>`).join('')}
function homeHTML(){let p=profile(),percent=Math.min(100,Math.round(p.xp/xpNeeded(p.level)*100));let pending=data.completions.filter(c=>c.profileId===current&&c.date===today()&&c.status==='pending').length;let done=data.completions.filter(c=>c.profileId===current&&c.date===today()&&c.status==='approved').length;return `<section class="hero"><div class="heroTop"><div><h2>¡Hola, ${p.name}!</h2><p>¿Preparado para subir de nivel?</p></div><span class="medal">✨</span></div><div class="levelRow"><div class="levelBadge">${p.level}</div><div class="levelText"><strong>Nivel ${p.level}</strong><small>${p.xp} / ${xpNeeded(p.level)} XP para el siguiente</small><div class="progress"><span style="width:${percent}%"></span></div></div></div><div class="stats"><div class="stat"><b>🪙 ${p.points}</b><small>Puntos</small></div><div class="stat"><b>⚡ ${done}</b><small>Hechas hoy</small></div><div class="stat"><b>⏳ ${pending}</b><small>Pendientes</small></div></div></section><section class="section"><div class="sectionHead"><h3>🎯 Tus tareas de hoy</h3><button class="action secondary" onclick="setView('tasks')">Ver todas</button></div>${data.tasks.filter(t=>t.frequency!=='weekly').slice(0,4).map(taskCard).join('')}</section><section class="section"><div class="sectionHead"><h3>🎁 Premios disponibles</h3><button class="action secondary" onclick="setView('rewards')">Tienda</button></div>${data.rewards.slice(0,2).map(rewardCard).join('')}</section>`}
function taskCard(t){let c=data.completions.find(c=>c.profileId===current&&c.taskId===t.id&&c.date===today()&&c.status!=='rejected');let label=c?(c.status==='pending'?'⏳ Pendiente':'✅ Completada'):'Enviar';return `<div class="card task"><div class="taskEmoji">${t.emoji||'⚡'}</div><div class="taskInfo"><strong>${esc(t.title)}</strong><small>${esc(t.description||'')}</small></div><span class="points">+${t.points}</span><button class="action ${c?'secondary':''}" ${c?'disabled':''} onclick="submitTask('${t.id}')">${label}</button></div>`}
function rewardCard(r){let p=profile();let pending=data.redemptions.some(x=>x.profileId===current&&x.rewardId===r.id&&x.status==='pending');return `<div class="card reward"><div class="taskEmoji">${r.emoji||'🎁'}</div><div class="taskInfo"><strong>${esc(r.title)}</strong><small>${esc(r.description||'')}</small><span class="points">${r.cost} 🪙</span></div><button class="action ${p.points>=r.cost&&!pending?'':'secondary'}" ${p.points<r.cost||pending?'disabled':''} onclick="redeem('${r.id}')">${pending?'Pendiente':p.points>=r.cost?'Solicitar':'Faltan puntos'}</button></div>`}
function tasksHTML(){return `<section class="hero"><h2>⚡ Mis misiones</h2><p>Completa tareas, envíalas y gana puntos cuando tus padres las aprueben.</p></section><section class="section"><h3>📅 Diarias</h3>${data.tasks.filter(t=>t.frequency==='daily').map(taskCard).join('')||'<div class="empty">No hay tareas diarias</div>'}</section><section class="section"><h3>🏆 Semanales</h3>${data.tasks.filter(t=>t.frequency==='weekly').map(taskCard).join('')||'<div class="empty">No hay tareas semanales</div>'}</section>`}
function rewardsHTML(){return `<section class="hero"><h2>🎁 Tienda de premios</h2><p>¡Ahorra tus monedas y canjéalas por premios!</p><div class="stat" style="margin-top:12px"><b>🪙 ${profile().points} puntos</b><small>Tu saldo disponible</small></div></section>${data.rewards.map(rewardCard).join('')}<section class="section"><h3>📬 Mis solicitudes</h3>${data.redemptions.filter(x=>x.profileId===current).slice().reverse().map(x=>{let r=data.rewards.find(r=>r.id===x.rewardId);return `<div class="card">${r?.emoji||'🎁'} ${esc(r?.title||'Premio')} — <strong>${x.status==='pending'?'⏳ Pendiente':x.status==='approved'?'✅ Aprobado':'❌ Rechazado'}</strong></div>`}).join('')||'<div class="empty">Todavía no has solicitado ningún premio.</div>'}</section>`}
function parentsHTML(){let pendingTasks=data.completions.filter(c=>c.status==='pending'),pendingRewards=data.redemptions.filter(c=>c.status==='pending');if(!parentUnlocked)return `<section class="hero"><h2>🛡️ Zona de padres</h2><p>Acceso para Mónica y Magno.</p></section><div class="parentPanel"><h3>🔐 Introduce el PIN familiar</h3><input class="field" id="pinInput" type="password" inputmode="numeric" placeholder="PIN de 4 dígitos" maxlength="4"><button class="action" onclick="unlockParents()">Entrar</button><p class="tiny">PIN inicial de la demo: 1234</p></div>`;return `<section class="hero"><h2>🛡️ Panel de padres</h2><p>Administra tareas, revisa solicitudes y ajusta puntos.</p></section><div class="parentPanel"><h3>⏳ Tareas por aprobar (${pendingTasks.length})</h3>${pendingTasks.map(c=>{let t=data.tasks.find(t=>t.id===c.taskId),p=data.profiles.find(p=>p.id===c.profileId);return `<div class="card approval"><div class="taskEmoji">${t?.emoji||'⚡'}</div><div class="taskInfo"><strong>${esc(p?.name||'')}: ${esc(t?.title||'Tarea')}</strong><small>+${t?.points||0} puntos</small></div><button class="action green" onclick="approve('${c.id}',true)">✓</button><button class="action red" onclick="approve('${c.id}',false)">✕</button></div>`}).join('')||'<div class="empty">No hay tareas pendientes 👌</div>'}</div><div class="parentPanel"><h3>🎁 Premios por aprobar (${pendingRewards.length})</h3>${pendingRewards.map(c=>{let r=data.rewards.find(r=>r.id===c.rewardId),p=data.profiles.find(p=>p.id===c.profileId);return `<div class="card approval"><div class="taskEmoji">${r?.emoji||'🎁'}</div><div class="taskInfo"><strong>${esc(p?.name||'')}: ${esc(r?.title||'Premio')}</strong><small>${r?.cost||0} puntos</small></div><button class="action green" onclick="approveReward('${c.id}',true)">✓</button><button class="action red" onclick="approveReward('${c.id}',false)">✕</button></div>`}).join('')||'<div class="empty">No hay premios pendientes</div>'}</div><div class="parentPanel"><h3>👨‍👩‍👧‍👦 Gestión</h3><div class="row"><button class="action secondary" onclick="addTask()">➕ Crear tarea</button><button class="action secondary" onclick="addReward()">🎁 Crear premio</button></div><h4>Modificar puntos</h4><select class="field" id="adjustProfile">${data.profiles.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><input class="field" id="adjustAmount" type="number" placeholder="Cantidad (+/-)"><input class="field" id="adjustReason" placeholder="Motivo"><button class="action" onclick="adjustPoints()">Aplicar ajuste</button><h4>Listado de tareas</h4>${data.tasks.map(t=>`<div class="card task"><div class="taskInfo"><strong>${esc(t.title)}</strong><small>${t.frequency} · ${t.points} puntos</small></div><button class="action red" onclick="deleteTask('${t.id}')">Eliminar</button></div>`).join('')}<h4>Listado de premios</h4>${data.rewards.map(r=>`<div class="card task"><div class="taskInfo"><strong>${esc(r.title)}</strong><small>${r.cost} puntos</small></div><button class="action red" onclick="deleteReward('${r.id}')">Eliminar</button></div>`).join('')}<h4>Historial</h4>${data.history.slice().reverse().slice(0,15).map(h=>{let p=data.profiles.find(p=>p.id===h.profileId);return `<div class="card">${esc(p?.name||'')} · ${h.amount>0?'+':''}${h.amount} pts · ${esc(h.reason)} <span class="tiny">${h.date}</span></div>`}).join('')||'<div class="empty">Sin movimientos aún</div>'}<button class="action secondary" onclick="parentUnlocked=false;render()">Cerrar sesión de padres</button>`}
function unlockParents(){if(document.getElementById('pinInput').value==='1234'){parentUnlocked=true;render();toast('Acceso de padres')}else toast('PIN incorrecto')}
function adjustPoints(){let id=document.getElementById('adjustProfile').value,n=parseInt(document.getElementById('adjustAmount').value,10),reason=document.getElementById('adjustReason').value.trim();if(!Number.isFinite(n)||!reason){toast('Completa cantidad y motivo');return}let p=data.profiles.find(p=>p.id===id);p.points=Math.max(0,p.points+n);data.history.push({profileId:id,amount:n,reason,date:today()});save()}
function addTask(){modal(`<h3>Crear tarea</h3><input id="newTaskTitle" class="field" placeholder="Nombre de la tarea"><input id="newTaskDesc" class="field" placeholder="Descripción"><input id="newTaskPoints" class="field" type="number" placeholder="Puntos" value="10"><select id="newTaskFreq" class="field"><option value="daily">Diaria</option><option value="weekly">Semanal</option><option value="once">Una vez</option></select><input id="newTaskEmoji" class="field" placeholder="Emoji" value="⚡"><div class="modalActions"><button class="action secondary" onclick="closeModal()">Cancelar</button><button class="action" onclick="saveTask()">Crear</button></div>`)}
function saveTask(){let title=document.getElementById('newTaskTitle').value.trim(),pts=+document.getElementById('newTaskPoints').value;if(!title||pts<=0){toast('Nombre y puntos válidos');return}data.tasks.push({id:crypto.randomUUID(),title,description:document.getElementById('newTaskDesc').value.trim(),points:pts,frequency:document.getElementById('newTaskFreq').value,emoji:document.getElementById('newTaskEmoji').value||'⚡'});closeModal();save();toast('Tarea creada')}
function addReward(){modal(`<h3>Crear premio</h3><input id="newRewardTitle" class="field" placeholder="Nombre del premio"><input id="newRewardDesc" class="field" placeholder="Descripción"><input id="newRewardCost" class="field" type="number" placeholder="Coste en puntos" value="100"><input id="newRewardEmoji" class="field" placeholder="Emoji" value="🎁"><div class="modalActions"><button class="action secondary" onclick="closeModal()">Cancelar</button><button class="action" onclick="saveReward()">Crear</button></div>`)}
function saveReward(){let title=document.getElementById('newRewardTitle').value.trim(),cost=+document.getElementById('newRewardCost').value;if(!title||cost<=0){toast('Nombre y coste válidos');return}data.rewards.push({id:crypto.randomUUID(),title,description:document.getElementById('newRewardDesc').value.trim(),cost,emoji:document.getElementById('newRewardEmoji').value||'🎁'});closeModal();save();toast('Premio creado')}
function deleteTask(id){if(confirm('¿Eliminar esta tarea?')){data.tasks=data.tasks.filter(t=>t.id!==id);save()}}function deleteReward(id){if(confirm('¿Eliminar este premio?')){data.rewards=data.rewards.filter(r=>r.id!==id);save()}}
function modal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function setView(v){activeView=v;document.querySelectorAll('.bottomNav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){renderSwitch();document.getElementById('view-home').innerHTML=homeHTML();document.getElementById('view-tasks').innerHTML=tasksHTML();document.getElementById('view-rewards').innerHTML=rewardsHTML();document.getElementById('view-parents').innerHTML=parentsHTML();document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+activeView));document.querySelectorAll('.bottomNav button').forEach(b=>b.classList.toggle('active',b.dataset.view===activeView))}
document.querySelectorAll('.bottomNav button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));initCloudApp();
</script></body></html>
